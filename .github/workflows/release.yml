name: Publish Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/labhistory-release.jks"

      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/labhistory-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Verify and prepare release files
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SOURCE"
          mkdir -p dist

          VERSION_CODE="$(apkanalyzer manifest version-code "$APK_SOURCE")"
          VERSION_NAME="$(apkanalyzer manifest version-name "$APK_SOURCE")"
          EXPECTED_TAG="v${VERSION_NAME}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $EXPECTED_TAG" >&2
            exit 1
          fi

          APK_NAME="LabHistory-${GITHUB_REF_NAME}.apk"
          APK_PATH="dist/${APK_NAME}"
          cp "$APK_SOURCE" "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}"

          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$SHA256" \
            '{
              versionCode: $versionCode,
              versionName: $versionName,
              minimumAndroid: 26,
              required: false,
              apkUrl: $apkUrl,
              sha256: $sha256,
              releaseNotes: [
                "АСТ, АЛТ и другие показатели из разных файлов объединяются при OCR-вариантах единиц, например 55 ЕдД/л и Повыше Ед/л",
                "Единицы уже сохранённых результатов перенормализуются локально после обновления, чтобы старые дубликаты объединились",
                "Подключены отдельные парсеры ИНВИТРО и Lab4U к экрану проверки показателей",
                "На экране проверки отображаются определённый формат и количество найденных строк",
                "В Lab4U исправлено смещение значения и единицы из-за служебных флагов 1, Tt, Т, { и |",
                "Процентный столбец Lab4U больше не распознаётся как символ доллара",
                "Существующие подтверждённые строки не меняются автоматически: используйте «Пересобрать из документа», проверьте и сохраните",
                "Добавлен индикатор состояния резервной копии на главном экране",
                "После добавления или удаления документов приложение напоминает обновить зашифрованную копию",
                "Напоминание не сохраняет пароль, путь или медицинские данные и не появляется чаще раза в неделю для одного состояния",
                "Исправлен главный экран: загруженные PDF снова всегда видны в списке документов",
                "Панель действий прокручивается отдельно и больше не вытесняет список за пределы экрана",
                "В заголовке списка отображается количество сохранённых документов",
                "Добавлен фильтр показателей по последним значениям вне референса бланка",
                "Добавлена сортировка показателей по названию, дате и отклонениям",
                "На главном экране появилась сводка последних показателей профиля",
                "Документы на главном экране сгруппированы по дате сдачи",
                "Добавлен поиск документов по лаборатории, имени файла, типу и статусу",
                "Добавлен экспорт показателей выбранного профиля в CSV для Excel",
                "CSV содержит даты сдачи, лаборатории, значения, единицы, референсы и статусы",
                "Перед созданием незашифрованного CSV показывается предупреждение о конфиденциальности",
                "Профили теперь можно редактировать и дополнять датой рождения и полом",
                "Ненужный профиль можно удалить вместе с его локальными документами после подтверждения",
                "Последний профиль защищён от случайного удаления",
                "Добавлена опциональная защита приложения отпечатком, лицом или кодом устройства",
                "При включённой защите содержимое скрывается в недавних приложениях и на скриншотах",
                "Добавлена зашифрованная резервная копия профилей, документов и показателей",
                "Копию можно сохранить в выбранное место и восстановить на другом устройстве",
                "Шифрование AES-256-GCM защищает содержимое паролем пользователя",
                "Повторяющиеся документы при восстановлении пропускаются по SHA-256",
                "Добавлен поиск показателей по названию и единице измерения",
                "Значения выше и ниже референса из бланка теперь отмечаются в истории",
                "Название показателя можно исправить или объединить с другой группой",
                "Отдельное измерение можно исправить или перенести в другую историю",
                "Ошибочное измерение можно удалить отдельно, сохранив исходный документ",
                "График и список можно фильтровать по периоду и лаборатории",
                "Точки вне указанного в бланке референса отмечаются красным",
                "Повторная загрузка одинакового файла в один профиль блокируется по SHA-256",
                "Отпечатки существующих документов заполняются локально после обновления",
                "Исходные PDF и фотографии при исправлении группировки не изменяются"
              ]
            }' > dist/update.json

          sha256sum "$APK_PATH" > "dist/${APK_NAME}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/LabHistory-"$GITHUB_REF_NAME".apk \
            dist/LabHistory-"$GITHUB_REF_NAME".apk.sha256 \
            dist/update.json \
            --title "LabHistory $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

      - name: Backup release to Yandex Disk
        env:
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${YANDEX_DISK_TOKEN:-}" ]]; then
            echo "::notice::YANDEX_DISK_TOKEN is not configured; Yandex Disk backup was skipped"
            exit 0
          fi
          bash .github/scripts/upload-yandex-disk.sh dist "$GITHUB_REF_NAME"
