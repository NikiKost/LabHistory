name: Publish Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/labhistory-release.jks"

      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/labhistory-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease

      - name: Verify and prepare release files
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SOURCE"
          mkdir -p dist

          VERSION_CODE="$(apkanalyzer manifest version-code "$APK_SOURCE")"
          VERSION_NAME="$(apkanalyzer manifest version-name "$APK_SOURCE")"
          EXPECTED_TAG="v${VERSION_NAME}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $EXPECTED_TAG" >&2
            exit 1
          fi

          APK_NAME="LabHistory-${GITHUB_REF_NAME}.apk"
          APK_PATH="dist/${APK_NAME}"
          cp "$APK_SOURCE" "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}"

          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$SHA256" \
            '{
              versionCode: $versionCode,
              versionName: $versionName,
              minimumAndroid: 26,
              required: false,
              apkUrl: $apkUrl,
              sha256: $sha256,
              releaseNotes: [
                ("Обновление приложения до версии " + $versionName),
                "Добавлена безопасная проверка и установка обновлений через GitHub Releases"
              ]
            }' > dist/update.json

          sha256sum "$APK_PATH" > "dist/${APK_NAME}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/LabHistory-"$GITHUB_REF_NAME".apk \
            dist/LabHistory-"$GITHUB_REF_NAME".apk.sha256 \
            dist/update.json \
            --title "LabHistory $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
